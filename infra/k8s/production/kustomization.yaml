apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tlacuilo

resources:
# - api-deployment.yaml     SPEC ONLY, NOT WIRED until the api and worker launch
# - worker-deployment.yaml  (README «Launching the api and worker»; file headers).
- service.yaml
- web-deployment.yaml
- web-service.yaml
- network-policies.yaml
# - external-secret.yaml    SPEC ONLY, NOT WIRED until Vault holds secret/tlacuilo.
- servicemonitor.yaml
- prometheusrule.yaml

# Image digest — pinned by the Build & Deploy workflow (kustomize edit set image +
# a commit to main → ArgoCD sync). The all-zero digest is a placeholder the FIRST
# successful build overwrites; it never resolves, so a deploy cannot run stale bits
# before a real pin lands. BOOTSTRAP GOTCHA (kalya/acervo): the reusable workflow's
# change detection diffs before-SHA..HEAD; on the very first push there is no HEAD~1
# and the build is SKIPPED — a second commit touching infra/k8s/production/ fixes it.
images:
- digest: sha256:97e66af7a6c2ad2ef225d94c644c449d4a08c03186470c12ed8816fdba7237b8
  name: ghcr.io/madfam-org/tlacuilo/tlacuilo-api
  newName: ghcr.io/madfam-org/tlacuilo/tlacuilo-api
- digest: sha256:065e796d54faf28e0c09c6e979f50f353145e43301cf33495551a9dcf420236a
  name: ghcr.io/madfam-org/tlacuilo/tlacuilo-web
  newName: ghcr.io/madfam-org/tlacuilo/tlacuilo-web
