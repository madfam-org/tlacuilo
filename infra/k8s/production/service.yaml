apiVersion: v1
kind: Service
metadata:
  # GOTCHA 2: named `tlacuilo` — the enclii SERVICE name — on port 80. Consumers dial
  # tlacuilo.tlacuilo.svc.cluster.local:80; there is no tunnel route by design.
  name: tlacuilo
  namespace: tlacuilo
  labels:
    app: tlacuilo
spec:
  selector:
    app.kubernetes.io/name: tlacuilo-api
  ports:
    - name: http
      port: 80
      targetPort: http
