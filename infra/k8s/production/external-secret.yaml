# Queue URLs, the Selva worker token and the callback HMAC key come from Vault
# secret/tlacuilo through ESO. They reach Vault only via `enclii secrets intake`
# (gate O3 in the operator console) — never a manifest, a PR or a chat.
#
# SPEC ONLY, NOT WIRED. This file is deliberately NOT listed in
# production/kustomization.yaml. Vault secret/tlacuilo has never existed, so from
# onboarding (2026-09-05) until it was unwired this ExternalSecret failed every
# refresh (SecretSyncedError, «Secret does not exist») and Argo marked the whole
# tlacuilo-services Application Degraded. ESO is all-or-nothing per
# ExternalSecret: one missing property fails all four keys. Rule: the Vault
# properties exist BEFORE this ExternalSecret reaches main.
#
# Wire it (uncomment it in production/kustomization.yaml and flip
# tests/test_manifests.py) only when all four properties below exist in Vault
# secret/tlacuilo, written through the Enclii secret intake (README «Launching the
# api and worker»), so it syncs on its first refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tlacuilo-config
  namespace: tlacuilo
  labels:
    app: tlacuilo
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: tlacuilo-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: secret/tlacuilo
        property: celery_broker_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef:
        key: secret/tlacuilo
        property: celery_result_backend
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SELVA_API_KEY
      remoteRef:
        key: secret/tlacuilo
        property: selva_api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: CALLBACK_HMAC_KEY
      remoteRef:
        key: secret/tlacuilo
        property: callback_hmac_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
