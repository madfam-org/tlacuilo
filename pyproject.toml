[project]
name = "tlacuilo"
version = "0.1.0"
description = "tlacuilo — MADFAM document-intelligence service: OCR + typed extraction, nothing durable (RFC 0040)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "pdfplumber>=0.11",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.9", "pip-licenses>=5", "pyyaml>=6"]

[project.scripts]
tlacuilo = "tlacuilo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tlacuilo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tlacuilo/api.py" = ["B008"]  # FastAPI Depends()/File()/Form() in defaults is the framework idiom
"tests/*" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
